<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кубик Рубіка 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg-gradient: linear-gradient(180deg, #529b89 0%, #3d796a 100%);
            --bg-panel: rgba(20, 20, 30, 0.9);
            --bg-topbar: rgba(20, 20, 30, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f0f0f5;
        }

        body { 
            overflow: hidden; 
            background: var(--bg-gradient); 
            font-family: system-ui, -apple-system, sans-serif; 
            color: var(--text-color); 
            height: 100vh; width: 100vw;
            -webkit-user-select: none; user-select: none;
            touch-action: none;
        }

        #canvas-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; 
            opacity: 0; transition: opacity 0.25s ease-in-out;
        }
        #canvas-container.loaded { opacity: 1; }
        
        #top-bar { 
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 10; 
            background: var(--bg-topbar); padding: 4px 12px; border-radius: 30px; 
            border: 1px solid var(--border-color); backdrop-filter: blur(15px); 
            display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .stat-badge { font-size: 12px; font-weight: 600; white-space: nowrap; }
        .stat-badge span { color: #00d2ff; font-size: 13px; }

        .sound-btn {
            background: none; border: none; color: var(--text-color); font-size: 16px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 2px 4px; border-radius: 50%; transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .sound-btn.muted { opacity: 0.5; }

        .theme-dots { display: flex; gap: 5px; align-items: center; }
        .theme-dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .theme-dot.active { border-color: #fff; transform: scale(1.1); }

        #controls-panel { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 10; 
            width: 100%; background: var(--bg-panel); 
            border-top: 1px solid var(--border-color); padding: 12px 10px 15px 10px; backdrop-filter: blur(20px); 
            box-shadow: 0 -5px 30px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 8px; 
            border-radius: 20px 20px 0 0;
        }

        .fx-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .action-btn { background: #2980b9; color: #fff; border: none; padding: 10px 0; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .danger-btn { background: #c0392b; color: #fff; border: none; padding: 10px 0; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }

        #touch-hint {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            z-index: 9; background: rgba(0,0,0,0.65); color: #fff; padding: 6px 14px;
            border-radius: 20px; font-size: 11px; pointer-events: none; text-align: center;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="touch-hint">🖐️ 1 палець — крутити куб | ✌️ 2 пальці — зафіксувати та свайпнути грань</div>
    
    <div id="top-bar">
        <div class="stat-badge">Moves: <span id="counter">0</span></div>
        <button id="sound-btn" class="sound-btn" onclick="toggleSound()">🔊</button>
        <div class="theme-dots">
            <div class="theme-dot" style="background: #09090e;" onclick="switchTheme('dark', this)"></div>
            <div class="theme-dot active" style="background: #529b89;" onclick="switchTheme('mint', this)"></div>
            <div class="theme-dot" style="background: #142824;" onclick="switchTheme('teal', this)"></div>
        </div>
    </div>

    <div id="controls-panel">
        <div class="fx-group">
            <button class="action-btn" onclick="triggerScramble()">🔀 Scramble</button>
            <button class="danger-btn" onclick="triggerReset()">⟳ Reset</button>
        </div>
    </div>

    <script>
        const COLORS = { U: '#fffb00', D: '#ffffff', R: '#00ff66', L: '#0066ff', F: '#ff0055', B: '#ff7700' };
        const THEMES = {
            dark: { gradient: 'linear-gradient(135deg, #09090e 0%, #141420 100%)' },
            mint: { gradient: 'linear-gradient(180deg, #529b89 0%, #3d796a 100%)' },
            teal: { gradient: 'linear-gradient(135deg, #142824 0%, #0a1412 100%)' }
        };

        let scene, camera, renderer, controls, cubies = [];
        let moveQueue = [], historyMoves = [], isAnimating = false, moveCount = 0, isMuted = false;

        const pivot = new THREE.Group();
        const CUBIE_SIZE = 0.99, PLASTIC_COLOR = '#3a3a42'; 

        const raycaster = new THREE.Raycaster();
        let hitCubie = null, hitNormal = null, hitPointWorld = new THREE.Vector3();
        let touchStartScreen = { x: 0, y: 0 };
        let activeTouchId = null;
        let touchStartTime = 0;

        function toggleSound() {
            isMuted = !isMuted;
            const btn = document.getElementById('sound-btn');
            btn.innerText = isMuted ? '🔇' : '🔊';
            btn.classList.toggle('muted', isMuted);
        }

        let audioCtx = null;
        function playClickSound() {
            if (isMuted) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const snapOsc = audioCtx.createOscillator();
                const snapGain = audioCtx.createGain();
                snapOsc.type = 'triangle';
                snapOsc.frequency.setValueAtTime(2400, now);
                snapOsc.frequency.exponentialRampToValueAtTime(250, now + 0.006);
                snapGain.gain.setValueAtTime(0.35, now);
                snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.006);
                snapOsc.connect(snapGain);
                snapGain.connect(audioCtx.destination);
                snapOsc.start(now); snapOsc.stop(now + 0.007);
            } catch (e) {}
        }

        function createFaceTexture(hexColor) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); 
            ctx.fillStyle = PLASTIC_COLOR; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = hexColor; ctx.beginPath(); ctx.roundRect(7, 7, 114, 114, 16); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createXeroxLogoTexture(hexColor) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); 
            ctx.fillStyle = PLASTIC_COLOR; ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = hexColor; ctx.beginPath(); ctx.roundRect(7, 7, 114, 114, 16); ctx.fill();
            ctx.fillStyle = '#c0392b';
            ctx.beginPath(); ctx.moveTo(32, 25); ctx.lineTo(46, 25); ctx.lineTo(64, 49); ctx.lineTo(50, 49); ctx.fill();
            ctx.beginPath(); ctx.moveTo(96, 25); ctx.lineTo(82, 25); ctx.lineTo(64, 49); ctx.lineTo(78, 49); ctx.fill();
            ctx.beginPath(); ctx.moveTo(32, 79); ctx.lineTo(46, 79); ctx.lineTo(64, 55); ctx.lineTo(50, 55); ctx.fill();
            ctx.beginPath(); ctx.moveTo(96, 79); ctx.lineTo(82, 79); ctx.lineTo(64, 55); ctx.lineTo(78, 55); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function buildCube() {
            cubies.forEach(c => scene.remove(c)); cubies = [];
            const geom = new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE);
            const internalMat = new THREE.MeshLambertMaterial({ color: PLASTIC_COLOR });

            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        if (x === 0 && y === 0 && z === 0) continue; 
                        const isWhiteCenter = (x === 0 && y === -1 && z === 0);
                        const mats = [
                            x === 1 ? new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.R) }) : internalMat,  
                            x === -1 ? new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.L) }) : internalMat, 
                            y === 1 ? new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.U) }) : internalMat,  
                            y === -1 ? new THREE.MeshLambertMaterial({ 
                                map: isWhiteCenter ? createXeroxLogoTexture(COLORS.D) : createFaceTexture(COLORS.D) 
                            }) : internalMat, 
                            z === 1 ? new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.F) }) : internalMat,  
                            z === -1 ? new THREE.MeshLambertMaterial({ map: createFaceTexture(COLORS.B) }) : internalMat  
                        ];
                        const mesh = new THREE.Mesh(geom, mats); 
                        mesh.position.set(x, y, z);
                        scene.add(mesh); cubies.push(mesh);
                    }
                }
            }
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene(); 
            camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(6.5, 5.0, 9.5); 
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;
            controls.target.set(0, -0.5, 0);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.85));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.35);
            dirLight.position.set(5, 15, 7); scene.add(dirLight);
            
            scene.add(pivot);
            buildCube();

            setupTouchSensors(renderer.domElement);

            container.classList.add('loaded');
            window.addEventListener('resize', onWindowResize);
            animateLoop();
        }

        function setupTouchSensors(element) {
            element.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    controls.enabled = true;
                    activeTouchId = null;
                } else if (e.touches.length >= 2) {
                    controls.enabled = false;

                    const touch = e.touches[e.touches.length - 1]; // Беремо найновіший доторкнутий палець
                    activeTouchId = touch.identifier;
                    touchStartTime = Date.now();

                    const rect = element.getBoundingClientRect();
                    const mouse = new THREE.Vector2(
                        ((touch.clientX - rect.left) / rect.width) * 2 - 1,
                        -((touch.clientY - rect.top) / rect.height) * 2 + 1
                    );

                    touchStartScreen = { x: touch.clientX, y: touch.clientY };

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(cubies);

                    if (intersects.length > 0) {
                        hitCubie = intersects[0].object;
                        hitPointWorld.copy(intersects[0].point);
                        hitNormal = intersects[0].face.normal.clone().applyQuaternion(hitCubie.quaternion).round();
                    } else {
                        hitCubie = null;
                    }
                }
            }, { passive: false });

            element.addEventListener('touchend', (e) => {
                if (activeTouchId !== null && hitCubie) {
                    let targetTouch = null;
                    for (let i = 0; i < e.changedTouches.length; i++) {
                        if (e.changedTouches[i].identifier === activeTouchId) {
                            targetTouch = e.changedTouches[i];
                            break;
                        }
                    }

                    if (targetTouch) {
                        const dx = targetTouch.clientX - touchStartScreen.x;
                        const dy = targetTouch.clientY - touchStartScreen.y;
                        const dist = Math.hypot(dx, dy);

                        if (dist > 30) {
                            processPerfectSwipe(dx, dy);
                        }
                    }
                }

                if (e.touches.length < 2) {
                    controls.enabled = true;
                    hitCubie = null;
                    activeTouchId = null;
                }
            });
        }

        function processPerfectSwipe(dx, dy) {
            if (!hitCubie || !hitNormal) return;

            const userSwipeScreen = new THREE.Vector2(dx, dy).normalize();
            
            // Якщо кубик ще крутиться, ми шукаємо точну позицію через світову матрицю
            const pos = new THREE.Vector3();
            hitCubie.getWorldPosition(pos);
            pos.round();

            const norm = hitNormal;

            let candidateMoves = [];

            if (Math.abs(norm.x) > 0.5) {
                if (Math.abs(pos.y) > 0.5) candidateMoves.push(pos.y > 0 ? "U" : "D", pos.y > 0 ? "U'" : "D'");
                if (Math.abs(pos.z) > 0.5) candidateMoves.push(pos.z > 0 ? "F" : "B", pos.z > 0 ? "F'" : "B'");
            } else if (Math.abs(norm.y) > 0.5) {
                if (Math.abs(pos.x) > 0.5) candidateMoves.push(pos.x > 0 ? "R" : "L", pos.x > 0 ? "R'" : "L'");
                if (Math.abs(pos.z) > 0.5) candidateMoves.push(pos.z > 0 ? "F" : "B", pos.z > 0 ? "F'" : "B'");
            } else if (Math.abs(norm.z) > 0.5) {
                if (Math.abs(pos.x) > 0.5) candidateMoves.push(pos.x > 0 ? "R" : "L", pos.x > 0 ? "R'" : "L'");
                if (Math.abs(pos.y) > 0.5) candidateMoves.push(pos.y > 0 ? "U" : "D", pos.y > 0 ? "U'" : "D'");
            }

            let bestMove = null;
            let maxDot = -Infinity;

            candidateMoves.forEach(moveStr => {
                const moveVector3D = calculatePointDisplacement(hitPointWorld, moveStr);
                const moveScreenDir = project3DVectorToScreen(hitPointWorld, moveVector3D);
                const dot = userSwipeScreen.dot(moveScreenDir);
                
                if (dot > maxDot) {
                    maxDot = dot;
                    bestMove = moveStr;
                }
            });

            if (bestMove) {
                handleMove(bestMove);
            }
            
            // Очищаємо сенсор після відпрацювання свайпу, щоб підготувати до наступного
            hitCubie = null;
            activeTouchId = null;
        }

        function calculatePointDisplacement(point, moveStr) {
            const face = moveStr[0];
            const isPrime = moveStr.includes("'");

            let axis = new THREE.Vector3();
            if (face === 'R') axis.set(1, 0, 0);
            else if (face === 'L') axis.set(-1, 0, 0);
            else if (face === 'U') axis.set(0, 1, 0);
            else if (face === 'D') axis.set(0, -1, 0);
            else if (face === 'F') axis.set(0, 0, 1);
            else if (face === 'B') axis.set(0, 0, -1);

            let angle = -Math.PI / 2;
            if (isPrime) angle = -angle;

            return new THREE.Vector3().crossVectors(axis, point).multiplyScalar(angle > 0 ? 1 : -1);
        }

        function project3DVectorToScreen(startPointWorld, vec3D) {
            const container = renderer.domElement;
            const p1 = startPointWorld.clone().project(camera);
            const p2 = startPointWorld.clone().add(vec3D.clone().multiplyScalar(0.1)).project(camera);

            const screenP1 = new THREE.Vector2(
                (p1.x + 1) * container.clientWidth / 2,
                (-p1.y + 1) * container.clientHeight / 2
            );
            const screenP2 = new THREE.Vector2(
                (p2.x + 1) * container.clientWidth / 2,
                (-p2.y + 1) * container.clientHeight / 2
            );

            return screenP2.sub(screenP1).normalize();
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (!isAnimating && moveQueue.length > 0) {
                const nextMove = moveQueue.shift();
                historyMoves.push(nextMove);
                executeMove(nextMove);
            }
            controls.update();
            renderer.render(scene, camera);
        }

        function getLayerCubies(face) {
            return cubies.filter(c => {
                const worldPos = new THREE.Vector3();
                c.getWorldPosition(worldPos);
                if (face === 'R') return worldPos.x > 0.5;
                if (face === 'L') return worldPos.x < -0.5;
                if (face === 'U') return worldPos.y > 0.5;
                if (face === 'D') return worldPos.y < -0.5;
                if (face === 'F') return worldPos.z > 0.5;
                if (face === 'B') return worldPos.z < -0.5;
                return false;
            });
        }

        function executeMove(moveStr) {
            isAnimating = true;
            playClickSound();

            const isPrime = moveStr.includes("'");
            const face = moveStr[0];
            const layer = getLayerCubies(face);

            pivot.position.set(0, 0, 0); 
            pivot.rotation.set(0, 0, 0);
            pivot.updateMatrixWorld();

            layer.forEach(c => pivot.attach(c));

            let angle = Math.PI / 2;
            if (face === 'R' || face === 'U' || face === 'F') angle = -angle;
            if (isPrime) angle = -angle;

            let currentProgress = 0;
            // Адаптивна тривалість: якщо в черзі накопичилися рухи, анімація прискорюється
            const duration = moveQueue.length > 1 ? 6 : 10; 

            function animateRotation() {
                currentProgress++;
                const step = angle / duration;
                
                if (face === 'R' || face === 'L') pivot.rotation.x += step;
                if (face === 'U' || face === 'D') pivot.rotation.y += step;
                if (face === 'F' || face === 'B') pivot.rotation.z += step;

                if (currentProgress < duration) {
                    requestAnimationFrame(animateRotation);
                } else {
                    pivot.updateMatrixWorld();
                    const tempArray = [...pivot.children];
                    tempArray.forEach(c => {
                        scene.attach(c);
                        c.position.x = Math.round(c.position.x);
                        c.position.y = Math.round(c.position.y);
                        c.position.z = Math.round(c.position.z);
                        c.rotation.x = Math.round(c.rotation.x / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.y = Math.round(c.rotation.y / (Math.PI / 2)) * (Math.PI / 2);
                        c.rotation.z = Math.round(c.rotation.z / (Math.PI / 2)) * (Math.PI / 2);
                    });
                    isAnimating = false;
                }
            }
            animateRotation();
        }

        function handleMove(move) {
            moveQueue.push(move);
            moveCount++;
            document.getElementById('counter').innerText = moveCount;
        }

        function triggerScramble() {
            const moves = ['U', 'D', 'R', 'L', 'F', 'B', "U'", "D'", "R'", "L'", "F'", "B'"];
            for (let i = 0; i < 20; i++) handleMove(moves[Math.floor(Math.random() * moves.length)]);
        }

        function triggerReset() {
            moveQueue = []; historyMoves = []; isAnimating = false; moveCount = 0;
            document.getElementById('counter').innerText = '0';
            buildCube();
            if (controls) controls.target.set(0, -0.5, 0);
        }

        function switchTheme(themeKey, element) {
            document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
            element.classList.add('active');
            document.body.style.background = THEMES[themeKey].gradient;
        }

        window.onload = init3D;
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
    </script>
</body>
</html>
